// 依 id 快速查詢品項所屬分類(即使日後菜單異動,舊訂單仍可對照到當時的分類)
const MENU_BY_ID = Object.fromEntries(MENU.map((m) => [m.id, m]));
const CAT_LABEL = Object.fromEntries(CATS.map((c) => [c.id, c.label]));
CAT_LABEL.other = '其他';

// 有些品項有多種選擇(例如冰/熱、杯裝/壺裝,或兩者組合),用 variants 陣列描述每個可選項目。
// 這個函式把 MENU 展開成「含所有變體」的完整對照表,讓購物車、結帳等邏輯不用另外處理。
function buildMenuById() {
  const map = {};
  MENU.forEach((m) => {
    if (m.variants) {
      m.variants.forEach((v) => {
        map[`${m.id}__${v.key}`] = { ...m, id: `${m.id}__${v.key}`, name: `${m.name} · ${v.label}`, price: v.price };
      });
    } else {
      map[m.id] = m;
    }
  });
  return map;
}

// 結帳彙總:計算總營收、總份數,並依分類、品項細分統計
function computeCheckoutSummary(orders) {
  const catTotals = {};
  let total = 0;
  let itemCount = 0;
  orders.forEach((o) => {
    (o.items || []).forEach((it) => {
      const baseId = it.id.split('__')[0]; // 冰/熱變體要對回原始品項才查得到分類
      const menuItem = MENU_BY_ID[baseId];
      const catId = menuItem ? menuItem.cat : 'other';
      const revenue = it.price * it.qty;
      total += revenue;
      itemCount += it.qty;
      if (!catTotals[catId]) catTotals[catId] = { revenue: 0, qty: 0, items: {} };
      catTotals[catId].revenue += revenue;
      catTotals[catId].qty += it.qty;
      if (!catTotals[catId].items[it.id]) catTotals[catId].items[it.id] = { name: it.name, qty: 0, revenue: 0 };
      catTotals[catId].items[it.id].qty += it.qty;
      catTotals[catId].items[it.id].revenue += revenue;
    });
  });
  return { total, itemCount, orderCount: orders.length, catTotals };
}

// 依訂單內每個品項的狀態,推算整筆訂單的彙總狀態(全部完成才算完成、有任何一項在做就算製作中)
function orderStatus(order) {
  const statuses = (order.items || []).map((it) => it.status || 'pending');
  if (statuses.length === 0) return 'pending';
  if (statuses.every((s) => s === 'done')) return 'done';
  if (statuses.some((s) => s === 'preparing' || s === 'done')) return 'preparing';
  return 'pending';
}

// 判斷是否已付款:新訂單一律有明確的 paid 欄位;
// 舊版(加入付款/離場分開追蹤之前)建立的訂單沒有 paid 欄位,
// 當時「結帳完成」等同付款完成,所以用 o.closed 當備援判斷,避免舊資料被誤判成未付款。
function isPaid(order) {
  return order.paid !== undefined ? order.paid : !!order.closed;
}

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const ordersRef = ref(db, 'orders');

async function loadOrders() {
  const snap = await get(ordersRef);
  return snap.val() || [];
}

async function saveOrders(list) {
  try {
    await set(ordersRef, list);
    return true;
  } catch (e) {
    console.error('寫入 Firebase 失敗:', e);
    return false;
  }
}

// 讓後台可以訂閱即時更新(任何裝置一有變動,這裡會馬上收到最新資料)
function subscribeOrders(callback, onError) {
  return onValue(
    ordersRef,
    (snap) => callback(snap.val() || []),
    (err) => { if (onError) onError(err); }
  );
}

/* ---------------------------------------------------------------
   歷史紀錄:結束營業清空訂單前,先把當天的訂單封存起來,
   之後可以在「歷史紀錄」頁籤依日期查詢當天營收與明細。
--------------------------------------------------------------- */
function todayKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
}

async function archiveDay(orders) {
  if (!orders || orders.length === 0) return true;
  const dateKey = todayKey();
  try {
    const daySnap = await get(ref(db, `history/${dateKey}`));
    const existing = daySnap.val();
    const mergedOrders = existing ? [...existing.orders, ...orders] : orders;
    await set(ref(db, `history/${dateKey}`), {
      date: dateKey,
      archivedAt: new Date().toISOString(),
      orders: mergedOrders,
    });
    return true;
  } catch (e) {
    console.error('封存歷史紀錄失敗:', e);
    return false;
  }
}

async function getHistoryList() {
  const snap = await get(ref(db, 'history'));
  const val = snap.val() || {};
  return Object.values(val).sort((a, b) => b.date.localeCompare(a.date));
}

function TableShape({ table, tint, selected, occupied, onClick, interactive }) {
  const bg = selected ? tint : occupied ? '#FBEFE6' : '#D9D2C2';
  const border = selected ? `2px solid ${tint}` : occupied ? '1.5px solid #C1440E' : '1px solid #C7BFAC';
  const textColor = selected ? '#fff' : occupied ? '#C1440E' : '#5c5445';
  return (
    <div
      role={interactive ? 'button' : undefined}
      onClick={interactive ? () => onClick(table.id) : undefined}
      className="absolute"
      style={{
        left: `${table.x}%`, top: `${table.y}%`, width: `${table.w}%`, height: `${table.h}%`,
        cursor: interactive ? 'pointer' : 'default',
      }}
    >
      <div
        className="w-full h-full rounded-md flex items-center justify-center transition-colors"
        style={{ background: bg, border }}
      >
        {interactive && (
          <span

              color: textColor,
            }}
          >
            {table.id}
          </span>

    </div>
  );
}

function TablePickScreen({ roomId, onBack, onPickTable }) {
  const room = roomById[roomId];
  const Icon = room.icon;
  const [selected, setSelected] = useState([]);
  const [occupiedIds, setOccupiedIds] = useState([]);

  // 找出這一區裡,目前還有「尚未結帳」訂單的座位,選位時用不同顏色標示出來
  useEffect(() => {
    const applyOrders = (list) => {
      const occ = [];
      (list || []).forEach((o) => {
        if (o.roomId === roomId && !o.closed) {
          (o.tableIds && o.tableIds.length ? o.tableIds : [o.tableId]).forEach((id) => { if (id) occ.push(id); });
        }
      });
      setOccupiedIds(occ);
    };
    if (typeof subscribeOrders === 'function') {
      const unsubscribe = subscribeOrders(applyOrders, () => {});
      return () => unsubscribe && unsubscribe();
    }
    let cancelled = false;
    let timer;
    const poll = () => {
      loadOrders().then((list) => { if (!cancelled) applyOrders(list); }).catch(() => {});
      timer = setTimeout(poll, 5000);
    };
    poll();
    return () => { cancelled = true; clearTimeout(timer); };
  }, [roomId]);

  const toggle = (id) => {
    if (occupiedIds.includes(id)) return; // 使用中的桌位不能選
    setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  };

  const totalSeats = room.tables
    .filter((t) => selected.includes(t.id))
    .reduce((s, t) => s + t.seats, 0);

  return (
    <div className="max-w-2xl mx-auto px-5 py-6 pb-28">
      <button onClick={onBack} className="flex items-center gap-1.5 mb-5" style={{ color: 'var(--olive)', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}>
        <ArrowLeft size={14} /> 回到平面圖
      </button>

      <div className="flex items-center gap-2 mb-1">
        <Icon size={19} color={room.tint} />
        <span style={{ fontFamily: 'var(--font-display)', fontSize: 22, color: 'var(--ash)' }}>{room.name}</span>
      </div>
      <p style={{ fontFamily: 'var(--font-body)', fontSize: 13, color: '#8a7e6f' }} className="mb-1">
        點選您實際坐的桌位,人數較多可以選兩桌以上
      </p>
      {occupiedIds.length > 0 && (
        <p className="flex items-center gap-1.5 mb-3" style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: '#C1440E' }}>
          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: '#FBEFE6', border: '1.5px solid #C1440E' }} />
          橘色代表這桌目前還有尚未結帳的訂單,無法選取
        </p>
      )}

      <div
        className="relative rounded-xl p-4"
        style={{ background: '#F6F2E9', border: '1px solid var(--line)' }}
      >
        <div className="relative w-full" style={{ paddingTop: '62%' }}>
          <div className="absolute inset-0">
            {room.tables.map((t) => (
              <TableShape
                key={t.id}
                table={t}
                tint={room.tint}
                interactive
                selected={selected.includes(t.id)}
                occupied={occupiedIds.includes(t.id)}
                onClick={toggle}
              />
            ))}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4">
        {room.tables.map((t) => {
          const occ = occupiedIds.includes(t.id);
          const isSelected = selected.includes(t.id);
          return (
            <button
              key={t.id}
              onClick={() => toggle(t.id)}
              disabled={occ}
              className="flex items-center justify-between px-3.5 py-2.5 rounded-lg disabled:cursor-not-allowed"
              style={{
                background: occ ? '#FBEFE6' : isSelected ? room.tint : 'var(--card)',
                border: occ ? '1.5px solid #C1440E' : isSelected ? `1.5px solid ${room.tint}` : '1px solid var(--line)',
              }}
            >
              <span style={{ fontFamily: 'var(--font-utility)', fontSize: 13, color: occ ? '#C1440E' : isSelected ? '#fff' : 'var(--ash)' }}>{t.id}</span>
              <span className="flex items-center gap-1" style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: occ ? '#C1440E' : isSelected ? '#fff' : '#8a7e6f' }}>
                {occ ? '使用中' : <><Users size={12} /> {t.seats}</>}
              </span>
            </button>
          );
        })}
      </div>

      {selected.length > 0 && (
        <div className="fixed bottom-0 left-0 right-0 px-5 py-4 flex items-center justify-between gap-3" style={{ background: 'var(--paper)', borderTop: '1px solid var(--line)' }}>
          <div className="min-w-0">
            <div style={{ fontFamily: 'var(--font-utility)', fontSize: 12.5, color: 'var(--ash)' }} className="truncate">
              已選 {selected.length} 桌:{selected.join('、')}
            </div>
            <div style={{ fontFamily: 'var(--font-body)', fontSize: 11.5, color: '#8a7e6f' }}>共 {totalSeats} 人座</div>
          </div>
          <button
            onClick={() => onPickTable(room.id, selected)}
            className="shrink-0 px-5 py-2.5 rounded-full"
            style={{ background: 'var(--ember)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 13 }}
          >
            確認,前往點餐
          </button>
        </div>
      )}
    </div>
  );
}

function Logo({ size = 40 }) {
  return (
    <div className="flex items-center gap-2">
      <img
        src={LOGO_SRC}
        alt="誠園藝境 CHENG YUAN GARDEN"
        style={{ width: size, height: size, objectFit: 'contain', display: 'block' }}
      />
      <div className="leading-tight">
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 19, color: 'var(--ash)', letterSpacing: '0.02em' }}>誠園藝境</div>
        <div style={{ fontFamily: 'var(--font-utility)', fontSize: 10, letterSpacing: '0.22em', color: 'var(--olive)' }}>CHENG YUAN GARDEN</div>
      </div>
    </div>
  );
}

function MenuItemCard({ item, qty, onAdd, onRemove }) {
  return (
    <div
      className="rounded-xl p-4 flex items-center justify-between gap-4"
      style={{ background: 'var(--card)', border: '1px solid var(--line)' }}
    >
      <div className="min-w-0">
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 16.5, color: 'var(--ash)' }}>{item.name}</div>
        <div style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#8a7e6f' }} className="mt-1 truncate">{item.desc}</div>
        <div style={{ fontFamily: 'var(--font-utility)', fontSize: 13.5, color: 'var(--gold-dark)' }} className="mt-2">{money(item.price)}</div>
      </div>
      {qty > 0 ? (
        <div className="flex items-center gap-2 shrink-0">
          <button onClick={onRemove} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: 'var(--limewash)', color: 'var(--ash)' }} aria-label={`減少 ${item.name}`}>
            <Minus size={15} />
          </button>
          <span style={{ fontFamily: 'var(--font-utility)', minWidth: 16, textAlign: 'center' }}>{qty}</span>
          <button onClick={onAdd} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: 'var(--ember)', color: '#fff' }} aria-label={`增加 ${item.name}`}>
            <Plus size={15} />
          </button>
        </div>
      ) : (
        <button
          onClick={onAdd}
          className="shrink-0 px-3.5 py-2 rounded-full flex items-center gap-1.5"
          style={{ background: 'var(--limewash)', color: 'var(--ash)', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}
        >
          <Plus size={14} /> 加入
        </button>
      )}
    </div>
  );
}

function VariantMenuItemCard({ item, cart, onAdd, onRemove }) {
  return (
    <div className="rounded-xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: 16.5, color: 'var(--ash)' }}>{item.name}</div>
      {item.desc && <div style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#8a7e6f' }} className="mt-1">{item.desc}</div>}
      <div className="flex flex-wrap gap-2 mt-3">
        {item.variants.map((v) => {
          const id = `${item.id}__${v.key}`;
          const qty = cart[id] || 0;
          return (
            <div
              key={v.key}
              className="flex items-center justify-between rounded-lg px-3 py-2"
              style={{ background: 'var(--limewash)', flex: '1 1 45%', minWidth: 128 }}
            >
              <div className="min-w-0">
                <div style={{ fontFamily: 'var(--font-utility)', fontSize: 12.5, color: 'var(--ash)' }}>{v.label}</div>
                <div style={{ fontFamily: 'var(--font-utility)', fontSize: 11, color: 'var(--gold-dark)' }}>{money(v.price)}</div>
              </div>
              {qty > 0 ? (
                <div className="flex items-center gap-1.5 shrink-0">
                  <button onClick={() => onRemove(id)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: '#fff', color: 'var(--ash)' }} aria-label={`減少 ${item.name} ${v.label}`}>
                    <Minus size={12} />
                  </button>
                  <span style={{ fontFamily: 'var(--font-utility)', fontSize: 12.5, minWidth: 12, textAlign: 'center' }}>{qty}</span>
                  <button onClick={() => onAdd(id)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: 'var(--ember)', color: '#fff' }} aria-label={`增加 ${item.name} ${v.label}`}>
                    <Plus size={12} />
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => onAdd(id)}
                  className="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
                  style={{ background: '#fff', color: 'var(--ash)' }}
                  aria-label={`加入 ${item.name} ${v.label}`}
                >
                  <Plus size={12} />
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CartDrawer({ open, onClose, cart, menuById, onAdd, onRemove, note, setNote, onSubmit, submitting, seatLabel, seatNote, error }) {
  const items = Object.entries(cart).filter(([id, q]) => q > 0 && menuById[id]);
  const total = items.reduce((s, [id, q]) => s + menuById[id].price * q, 0);

  return (
    <div className={`fixed inset-0 z-40 transition-opacity ${open ? 'pointer-events-auto opacity-100' : 'pointer-events-none opacity-0'}`}>
      <div className="absolute inset-0" style={{ background: 'rgba(43,36,32,0.4)' }} onClick={onClose} />
      <div
        className="absolute right-0 top-0 bottom-0 w-full sm:w-[420px] flex flex-col"
        style={{ background: 'var(--paper)', transform: open ? 'translateX(0)' : 'translateX(100%)', transition: 'transform 0.3s ease' }}
      >
        <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: '1px solid var(--line)' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 19, color: 'var(--ash)' }}>您的訂單</div>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full" style={{ background: 'var(--limewash)' }}>
            <X size={16} />
          </button>
        </div>
        <div style={{ fontFamily: 'var(--font-utility)', fontSize: 12, color: 'var(--olive)' }} className="px-5 pt-3 tracking-wide">座位:{seatLabel}</div>
        {seatNote && (
          <div className="px-5 pt-1.5 flex items-start gap-1.5" style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: '#8a7e6f' }}>
            <MapPin size={12} className="mt-0.5 shrink-0" /> {seatNote}
          </div>
        )}

        <div className="flex-1 overflow-y-auto px-5 py-4 space-y-3">
          {items.length === 0 && (
            <div className="text-center py-16" style={{ color: '#a89b8a', fontFamily: 'var(--font-body)', fontSize: 14 }}>
              購物車還是空的,去菜單看看吧
            </div>
          )}
          {items.map(([id, q]) => {
            const it = menuById[id];
            return (
              <div key={id} className="flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <div style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--ash)' }} className="truncate">{it.name}</div>
                  <div style={{ fontFamily: 'var(--font-utility)', fontSize: 12, color: '#8a7e6f' }}>{money(it.price)} × {q}</div>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={() => onRemove(id)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: 'var(--limewash)' }}><Minus size={13} /></button>
                  <span style={{ minWidth: 14, textAlign: 'center', fontFamily: 'var(--font-utility)', fontSize: 13 }}>{q}</span>
                  <button onClick={() => onAdd(id)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: 'var(--ember)', color: '#fff' }}><Plus size={13} /></button>
                </div>
              </div>
            );
          })}

          {items.length > 0 && (
            <div className="pt-2">
              <label className="flex items-center gap-1.5 mb-1.5" style={{ fontFamily: 'var(--font-utility)', fontSize: 11.5, color: 'var(--olive)' }}>
                <StickyNote size={13} /> 備註(選填)
              </label>
              <textarea
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="例如:不加洋蔥、餐點分開上"
                rows={2}
                className="w-full rounded-lg px-3 py-2 text-sm resize-none focus:outline-none"
                style={{ background: 'var(--card)', border: '1px solid var(--line)', fontFamily: 'var(--font-body)' }}
              />
            </div>
          )}
        </div>

        <div className="px-5 py-4" style={{ borderTop: '1px solid var(--line)' }}>
          {error && (
            <div className="mb-3 px-3 py-2 rounded-lg text-xs" style={{ background: '#FBEFE6', color: 'var(--ember)', fontFamily: 'var(--font-body)' }}>
              {error}
            </div>
          )}
          <div className="flex items-center justify-between mb-3">
            <span style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: '#6b6154' }}>總計</span>
            <span style={{ fontFamily: 'var(--font-display)', fontSize: 22, color: 'var(--ash)' }}>{money(total)}</span>
          </div>
          <button
            disabled={items.length === 0 || submitting}
            onClick={onSubmit}
            className="w-full py-3 rounded-full flex items-center justify-center gap-2 disabled:opacity-40"
            style={{ background: 'var(--ember)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 14, letterSpacing: '0.05em' }}
          >
            {submitting ? '送出中…' : '送出訂單'}
          </button>
        </div>
      </div>
    </div>
  );
}

function QuickSwitchModal({ open, onClose, onSwitch, currentRoomId, currentTableIds }) {
  const [selRoom, setSelRoom] = useState(null);
  const [selTables, setSelTables] = useState([]);

  useEffect(() => {
    if (open) { setSelRoom(null); setSelTables([]); }
  }, [open]);

  if (!open) return null;

  const toggle = (roomId, tableId) => {
    if (selRoom !== roomId) {
      setSelRoom(roomId);
      setSelTables([tableId]);
    } else {
      setSelTables((s) => (s.includes(tableId) ? s.filter((x) => x !== tableId) : [...s, tableId]));
    }
  };

  return (
    <div className="fixed inset-0 z-50">
      <div className="absolute inset-0" style={{ background: 'rgba(43,36,32,0.45)' }} onClick={onClose} />
      <div
        className="absolute left-0 right-0 bottom-0 sm:left-1/2 sm:top-1/2 sm:right-auto sm:bottom-auto sm:-translate-x-1/2 sm:-translate-y-1/2 sm:w-[480px] sm:rounded-2xl rounded-t-2xl max-h-[80vh] overflow-y-auto"
        style={{ background: 'var(--paper)', border: '1px solid var(--line)' }}
      >
        <div className="flex items-center justify-between px-5 py-4 sticky top-0" style={{ background: 'var(--paper)', borderBottom: '1px solid var(--line)' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, color: 'var(--ash)' }}>切換座位</div>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full" style={{ background: 'var(--limewash)' }}>
            <X size={16} />
          </button>
        </div>
        <p className="px-5 pt-3" style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: '#8a7e6f' }}>
          人數較多可以在同一區內多選幾桌
        </p>
        <div className="px-5 py-4 pb-24">
          {ALL_ROOMS.map((room) => (
            <div key={room.id} className="mb-5">
              <div className="flex items-center gap-1.5 mb-2">
                <room.icon size={14} color={room.tint} />
                <span style={{ fontFamily: 'var(--font-utility)', fontSize: 12, color: 'var(--ash)' }}>{room.short} · {room.name}</span>
              </div>
              {room.tables.length > 0 ? (
                <div className="grid grid-cols-4 gap-2">
                  {room.tables.map((t) => {
                    const isSelected = selRoom === room.id && selTables.includes(t.id);
                    const isCurrent = !selRoom && room.id === currentRoomId && (currentTableIds || []).includes(t.id);
                    const highlight = isSelected || isCurrent;
                    return (
                      <button
                        key={t.id}
                        onClick={() => toggle(room.id, t.id)}
                        className="py-2.5 rounded-lg"
                        style={{
                          fontFamily: 'var(--font-utility)', fontSize: 12.5,
                          background: highlight ? room.tint : 'var(--card)',
                          color: highlight ? '#fff' : 'var(--ash)',
                          border: `1px solid ${highlight ? room.tint : 'var(--line)'}`,
                        }}
                      >
                        {t.id}
                      </button>
                    );
                  })}
                </div>
              ) : (
                <button
                  onClick={() => onSwitch(room.id, [])}
                  className="w-full py-2.5 rounded-lg"
                  style={{
                    fontFamily: 'var(--font-utility)', fontSize: 12.5,
                    background: room.id === currentRoomId ? room.tint : 'var(--card)',
                    color: room.id === currentRoomId ? '#fff' : 'var(--ash)',
                    border: `1px solid ${room.id === currentRoomId ? room.tint : 'var(--line)'}`,
                  }}
                >
                  {room.isTakeout ? '切換到外帶點餐' : '進入這一區(不分桌)'}
                </button>
              )}
            </div>
          ))}
        </div>

        {selTables.length > 0 && (
          <div className="fixed bottom-0 left-0 right-0 sm:absolute px-5 py-4 flex items-center justify-between gap-3" style={{ background: 'var(--paper)', borderTop: '1px solid var(--line)' }}>
            <span style={{ fontFamily: 'var(--font-utility)', fontSize: 12.5, color: 'var(--ash)' }}>
              已選 {selTables.length} 桌:{selTables.join('、')}
            </span>
            <button
              onClick={() => onSwitch(selRoom, selTables)}
              className="shrink-0 px-4 py-2 rounded-full"
              style={{ background: 'var(--ember)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}
            >
              確認切換
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function OrderScreen({ roomId, tableIds, seatNote, cart, setCart, activeOrderId, onBack, onSwitchTable, onOrdered }) {
  const room = roomById[roomId];
  const [activeCat, setActiveCat] = useState('pizza');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [note, setNote] = useState('');
  const [pickupTime, setPickupTime] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');
  const [switchOpen, setSwitchOpen] = useState(false);
  const menuById = buildMenuById();

  // 切換到別桌時,清掉這一桌專屬的暫存狀態(備註草稿、開著的購物車、錯誤訊息)
  useEffect(() => {
    setNote('');
    setPickupTime('');
    setDrawerOpen(false);
    setError('');
  }, [roomId, tableIds]);

  const add = (id) => setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const remove = (id) => setCart((c) => ({ ...c, [id]: Math.max(0, (c[id] || 0) - 1) }));

  const totalQty = Object.values(cart).reduce((s, q) => s + q, 0);
  const totalPrice = Object.entries(cart).reduce((s, [id, q]) => s + (menuById[id] ? menuById[id].price * q : 0), 0);
  const seatLabel = room.isTakeout
    ? `外帶${pickupTime.trim() ? ` · ${pickupTime.trim()} 取貨` : ''}`
    : (tableIds && tableIds.length ? `${room.name} · ${tableIds.join('、')}` : room.name);

  const submitOrder = async () => {
    setSubmitting(true);
    setError('');
    try {
      if (room.isTakeout && !pickupTime.trim()) {
        setError('請填寫取貨時間');
        setSubmitting(false);
        return;
      }
      const newItems = Object.entries(cart)
        .filter(([id, q]) => q > 0 && menuById[id])
        .map(([id, q]) => ({
          id, name: menuById[id].name, price: menuById[id].price, qty: q, status: 'pending',
        }));
      if (newItems.length === 0) {
        setError('購物車是空的,請先加點餐點');
        setSubmitting(false);
        return;
      }

      const existing = await loadOrders();
      let resultOrder;
      let merged = false;

      // 直接以資料庫裡的實際資料判斷:這一桌(roomId+tableIds 組合)是否已經有一張「尚未結帳」的訂單。
      // 這樣不管是重新整理頁面、切換分頁、還是換其他裝置操作,都能準確合併到同一張單,
      // 不再依賴瀏覽器暫存的 activeOrderId(那個只是用來顯示「加點中」提示用的)。
      // 外帶沒有實體座位,每一筆都是獨立顧客,不做自動合併,一律建立新訂單。
      const sortedIds = (tableIds || []).slice().sort();
      const targetIdx = room.isTakeout ? -1 : existing.findIndex((o) => {
        if (o.roomId !== roomId || o.closed) return false;
        const oIds = (o.tableIds && o.tableIds.length ? o.tableIds : (o.tableId ? [o.tableId] : [])).slice().sort();
        return JSON.stringify(oIds) === JSON.stringify(sortedIds);
      });
      if (targetIdx !== -1) {
        // 這桌已經有進行中的訂單,把新點的餐點加進去(視為新的一批,狀態各自從待處理開始)
        const target = existing[targetIdx];
        const mergedItems = [...target.items, ...newItems];
        resultOrder = {
          ...target,
          items: mergedItems,
          note: note ? (target.note ? `${target.note} / ${note}` : note) : target.note,
          total: mergedItems.reduce((s, i) => s + i.price * i.qty, 0),
          updatedAt: new Date().toISOString(),
        };
        const updated = existing.map((o, i) => (i === targetIdx ? resultOrder : o));
        const saved = await saveOrders(updated);
        if (!saved) throw new Error('儲存失敗');
        merged = true;
      } else {
        // 沒有進行中的訂單(第一次點餐,或原訂單已經結帳),建立新訂單
        resultOrder = {
          id: `ord_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          roomId, roomName: room.name, tableIds: tableIds || [],
          seatLabel, seatNote: seatNote || '',
          isTakeout: !!room.isTakeout, pickupTime: room.isTakeout ? pickupTime.trim() : '',
          items: newItems, note, total: newItems.reduce((s, i) => s + i.price * i.qty, 0),
          status: 'pending', closed: false, paid: false, createdAt: new Date().toISOString(),
        };
        const updated = [resultOrder, ...existing];
        const saved = await saveOrders(updated);
        if (!saved) throw new Error('儲存失敗');
      }

      setCart({});
      setNote('');
      setDrawerOpen(false);
      onOrdered(resultOrder, merged);
    } catch (e) {
      console.error('送出訂單失敗:', e);
      let detail = '';
      if (e) {
        if (typeof e === 'string') detail = e;
        else if (e.message) detail = e.message;
        else { try { detail = JSON.stringify(e); } catch (_) { detail = String(e); } }
      }
      setError(`送出訂單時發生問題,請再試一次${detail ? `(${detail})` : ''}`);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="pb-28">
      <div className="max-w-3xl mx-auto px-5 pt-6">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <button onClick={onBack} className="flex items-center gap-1.5" style={{ color: 'var(--olive)', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}>
            <ArrowLeft size={14} /> 更換座位
          </button>
          <button
            onClick={() => setSwitchOpen(true)}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded-full"
            style={{ background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--ash)', fontFamily: 'var(--font-utility)', fontSize: 12 }}
          >
            <ArrowLeftRight size={13} /> 切換座位
          </button>
        </div>

        <div className="flex items-center gap-2 mb-6">
          <room.icon size={18} color={room.tint} />
          <span style={{ fontFamily: 'var(--font-display)', fontSize: 17, color: 'var(--ash)' }}>{seatLabel}</span>
          {activeOrderId && (
            <span
              className="px-2 py-0.5 rounded-full"
              style={{ background: '#FBEFE6', color: 'var(--ember)', fontFamily: 'var(--font-utility)', fontSize: 10.5 }}
            >
              加點中
            </span>
          )}
        </div>

        {room.isTakeout && (
          <div className="mb-6 -mt-3">
            <label className="flex items-center gap-1.5 mb-1.5" style={{ fontFamily: 'var(--font-utility)', fontSize: 11.5, color: 'var(--olive)' }}>
              <Clock size={13} /> 取貨時間(必填)
            </label>
            <input
              type="text"
              value={pickupTime}
              onChange={(e) => setPickupTime(e.target.value)}
              placeholder="例如:18:30、或 20分鐘後"
              className="w-full max-w-xs rounded-lg px-3.5 py-2.5 text-sm focus:outline-none"
              style={{ background: 'var(--card)', border: '1px solid var(--line)', fontFamily: 'var(--font-body)', color: 'var(--ash)' }}
            />
          </div>
        )}

        <div className="flex gap-2 overflow-x-auto pb-1 mb-6" style={{ scrollbarWidth: 'none' }}>
          {CATS.map((c) => (
            <button
              key={c.id}
              onClick={() => setActiveCat(c.id)}
              className="px-4 py-2 rounded-full whitespace-nowrap"
              style={{
                fontFamily: 'var(--font-utility)', fontSize: 13,
                background: activeCat === c.id ? 'var(--ash)' : 'var(--card)',
                color: activeCat === c.id ? '#fff' : 'var(--ash)',
                border: '1px solid var(--line)',
              }}
            >
              {c.label}
            </button>
          ))}
        </div>

        <div className="space-y-3">
          {MENU.filter((m) => m.cat === activeCat).map((item) => (
            item.variants ? (
              <VariantMenuItemCard
                key={item.id}
                item={item}
                cart={cart}
                onAdd={add}
                onRemove={remove}
              />
            ) : (
              <MenuItemCard
                key={item.id}
                item={item}
                qty={cart[item.id] || 0}
                onAdd={() => add(item.id)}
                onRemove={() => remove(item.id)}
              />
            )
          ))}
        </div>
        {error && <div className="mt-4 text-sm" style={{ color: 'var(--ember)' }}>{error}</div>}
      </div>

      {totalQty > 0 && (
        <button
          onClick={() => setDrawerOpen(true)}
          className="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-full flex items-center gap-3 shadow-lg"
          style={{ background: 'var(--ash)', color: '#fff' }}
        >
          <ShoppingCart size={17} />
          <span style={{ fontFamily: 'var(--font-utility)', fontSize: 13.5 }}>{totalQty} 項 · {money(totalPrice)}</span>
        </button>
      )}

      <CartDrawer
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        cart={cart}
        menuById={menuById}
        onAdd={add}
        onRemove={remove}
        note={note}
        setNote={setNote}
        onSubmit={submitOrder}
        submitting={submitting}
        seatLabel={seatLabel}
        seatNote={seatNote}
        error={error}
      />

      <QuickSwitchModal
        open={switchOpen}
        onClose={() => setSwitchOpen(false)}
        currentRoomId={roomId}
        currentTableIds={tableIds}
        onSwitch={(rId, tIds) => {
          onSwitchTable(rId, tIds);
          setSwitchOpen(false);
        }}
      />
    </div>
  );
}

function CheckoutView({ orders, onClearAll, clearing }) {
  const summary = computeCheckoutSummary(orders);
  const paidSummary = computeCheckoutSummary(orders.filter((o) => isPaid(o)));
  const unpaidSummary = computeCheckoutSummary(orders.filter((o) => !isPaid(o)));
  const adjustedOrders = orders.filter((o) => o.amountReceived != null && o.amountReceived !== o.total);
  const netDiff = adjustedOrders.reduce((s, o) => s + (o.total - o.amountReceived), 0); // 正數 = 少收,負數 = 多收
  const [confirmClear, setConfirmClear] = useState(false);
  const catOrder = Object.keys(summary.catTotals).sort((a, b) => summary.catTotals[b].revenue - summary.catTotals[a].revenue);

  if (orders.length === 0) {
    return (
      <div className="text-center py-20" style={{ color: '#a89b8a', fontFamily: 'var(--font-body)' }}>
        目前還沒有任何訂單可以結算
      </div>
    );
  }

  return (
    <div>
      <div className="rounded-xl p-5 mb-4" style={{ background: 'var(--ash)' }}>
        <div style={{ fontFamily: 'var(--font-utility)', fontSize: 11, letterSpacing: '0.2em', color: '#C9BFA9' }}>今日總營收</div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 40, color: '#fff' }} className="mt-1">{money(summary.total)}</div>
        <div className="flex gap-5 mt-3" style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#C9BFA9' }}>
          <span>{summary.orderCount} 張訂單</span>
          <span>{summary.itemCount} 份餐點</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <div className="rounded-xl p-4" style={{ background: '#EAEFE2', border: '1px solid #C8D3B4' }}>
          <div style={{ fontFamily: 'var(--font-utility)', fontSize: 10.5, letterSpacing: '0.15em', color: '#5B6B41' }}>已付款完成</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 24, color: '#5B6B41' }} className="mt-1">{money(paidSummary.total)}</div>
          <div style={{ fontFamily: 'var(--font-body)', fontSize: 11.5, color: '#5B6B41' }} className="mt-1">{paidSummary.orderCount} 張訂單</div>
        </div>
        <div className="rounded-xl p-4" style={{ background: '#FBEFE6', border: '1px solid #E9C7AE' }}>
          <div style={{ fontFamily: 'var(--font-utility)', fontSize: 10.5, letterSpacing: '0.15em', color: 'var(--ember)' }}>未付款</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 24, color: 'var(--ember)' }} className="mt-1">{money(unpaidSummary.total)}</div>
          <div style={{ fontFamily: 'var(--font-body)', fontSize: 11.5, color: 'var(--ember)' }} className="mt-1">{unpaidSummary.orderCount} 張訂單</div>
        </div>
      </div>

      {adjustedOrders.length > 0 && (
        <div
          className="rounded-xl p-4 mb-4"
          style={{ background: netDiff > 0 ? '#FBEFE6' : '#EAEFE2', border: `1px solid ${netDiff > 0 ? '#E9C7AE' : '#C8D3B4'}` }}
        >
          <div style={{ fontFamily: 'var(--font-utility)', fontSize: 10.5, letterSpacing: '0.15em', color: netDiff > 0 ? 'var(--ember)' : '#5B6B41' }}>
            收款落差(有修正過實收金額的訂單)
          </div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 22, color: netDiff > 0 ? 'var(--ember)' : '#5B6B41' }} className="mt-1">
            {netDiff === 0 ? '打平' : netDiff > 0 ? `少收 ${money(netDiff)}` : `多收 ${money(-netDiff)}`}
          </div>
          <div style={{ fontFamily: 'var(--font-body)', fontSize: 11.5, color: netDiff > 0 ? 'var(--ember)' : '#5B6B41' }} className="mt-1">
            共 {adjustedOrders.length} 張訂單有修正實收金額
          </div>
        </div>
      )}

      <div style={{ fontFamily: 'var(--font-utility)', fontSize: 11.5, color: 'var(--olive)' }} className="mb-2 tracking-wide">分類明細</div>
      <div className="space-y-3 mb-6">
        {catOrder.map((catId) => {
          const cat = summary.catTotals[catId];
          const items = Object.values(cat.items).sort((a, b) => b.revenue - a.revenue);
          return (
            <div key={catId} className="rounded-xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
              <div className="flex items-center justify-between">
                <span style={{ fontFamily: 'var(--font-display)', fontSize: 16, color: 'var(--ash)' }}>{CAT_LABEL[catId] || catId}</span>
                <span style={{ fontFamily: 'var(--font-utility)', fontSize: 15, color: 'var(--gold-dark)' }}>{money(cat.revenue)}</span>
              </div>
              <div style={{ fontFamily: 'var(--font-body)', fontSize: 11.5, color: '#a89b8a' }} className="mb-2.5">共 {cat.qty} 份</div>
              <div className="space-y-1">
                {items.map((it, i) => (
                  <div key={i} className="flex items-center justify-between" style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#6b6154' }}>
                    <span>{it.name} × {it.qty}</span>
                    <span>{money(it.revenue)}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      <div className="rounded-xl p-4" style={{ background: '#FBEFE6', border: '1px solid #E9C7AE' }}>
        {!confirmClear ? (
          <button
            onClick={() => setConfirmClear(true)}
            className="w-full py-2.5 rounded-full"
            style={{ background: 'var(--ember)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 13 }}
          >
            結束營業・清空所有訂單
          </button>
        ) : (
          <div>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: 'var(--ember)' }} className="mb-3">
              確定要清空全部 {orders.length} 筆訂單嗎?清空後上面的營收記錄會歸零,且無法復原。
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmClear(false)}
                className="flex-1 py-2.5 rounded-full"
                style={{ background: 'var(--card)', color: 'var(--ash)', border: '1px solid var(--line)', fontFamily: 'var(--font-utility)', fontSize: 13 }}
              >
                取消
              </button>
              <button
                onClick={() => { onClearAll(); setConfirmClear(false); }}
                disabled={clearing}
                className="flex-1 py-2.5 rounded-full disabled:opacity-50"
                style={{ background: 'var(--ember)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 13 }}
              >
                {clearing ? '清空中…' : '確定清空'}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function HistoryView() {
  const [days, setDays] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [selected, setSelected] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    setError('');
    try {
      const list = await getHistoryList();
      setDays(list);
    } catch (e) {
      setError('讀取歷史紀錄失敗,請檢查網路連線');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  if (loading) {
    return <div style={{ color: '#a89b8a', fontFamily: 'var(--font-body)' }}>載入中…</div>;
  }
  if (error) {
    return <div className="text-sm" style={{ color: 'var(--ember)' }}>{error}</div>;
  }

  if (selected) {
    const day = days.find((d) => d.date === selected);
    if (!day) return null;
    const summary = computeCheckoutSummary(day.orders);
    const catOrder = Object.keys(summary.catTotals).sort((a, b) => summary.catTotals[b].revenue - summary.catTotals[a].revenue);
    return (
      <div>
        <button onClick={() => setSelected(null)} className="flex items-center gap-1.5 mb-4" style={{ color: 'var(--olive)', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}>
          <ArrowLeft size={14} /> 回歷史列表
        </button>
        <div className="rounded-xl p-5 mb-4" style={{ background: 'var(--ash)' }}>
          <div style={{ fontFamily: 'var(--font-utility)', fontSize: 11, letterSpacing: '0.2em', color: '#C9BFA9' }}>{day.date} 營收</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 36, color: '#fff' }} className="mt-1">{money(summary.total)}</div>
          <div className="flex gap-5 mt-3" style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#C9BFA9' }}>
            <span>{summary.orderCount} 張訂單</span>
            <span>{summary.itemCount} 份餐點</span>
          </div>
        </div>
        <div style={{ fontFamily: 'var(--font-utility)', fontSize: 11.5, color: 'var(--olive)' }} className="mb-2 tracking-wide">分類明細</div>
        <div className="space-y-3">
          {catOrder.map((catId) => {
            const cat = summary.catTotals[catId];
            const items = Object.values(cat.items).sort((a, b) => b.revenue - a.revenue);
            return (
              <div key={catId} className="rounded-xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
                <div className="flex items-center justify-between">
                  <span style={{ fontFamily: 'var(--font-display)', fontSize: 16, color: 'var(--ash)' }}>{CAT_LABEL[catId] || catId}</span>
                  <span style={{ fontFamily: 'var(--font-utility)', fontSize: 15, color: 'var(--gold-dark)' }}>{money(cat.revenue)}</span>
                </div>
                <div style={{ fontFamily: 'var(--font-body)', fontSize: 11.5, color: '#a89b8a' }} className="mb-2.5">共 {cat.qty} 份</div>
                <div className="space-y-1">
                  {items.map((it, i) => (
                    <div key={i} className="flex items-center justify-between" style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#6b6154' }}>
                      <span>{it.name} × {it.qty}</span>
                      <span>{money(it.revenue)}</span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (days.length === 0) {
    return (
      <div className="text-center py-20" style={{ color: '#a89b8a', fontFamily: 'var(--font-body)' }}>
        目前還沒有歷史紀錄。在「結帳」頁籤按下「結束營業・清空所有訂單」後,
        當天的資料就會自動保存在這裡,方便之後查詢。
      </div>
    );
  }

  return (
    <div className="space-y-2">
      {days.map((d) => {
        const summary = computeCheckoutSummary(d.orders);
        return (
          <button
            key={d.date}
            onClick={() => setSelected(d.date)}
            className="w-full flex items-center justify-between px-4 py-3 rounded-xl"
            style={{ background: 'var(--card)', border: '1px solid var(--line)' }}
          >
            <span style={{ fontFamily: 'var(--font-display)', fontSize: 16, color: 'var(--ash)' }}>{d.date}</span>
            <span style={{ fontFamily: 'var(--font-utility)', fontSize: 12.5, color: '#8a7e6f' }}>{summary.orderCount} 張訂單 · {money(summary.total)}</span>
          </button>
        );
      })}
    </div>
  );
}

function AdminAuthScreen({ onSuccess, onBack }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState('');

  const submit = () => {
    if (value === ADMIN_PASSWORD) {
      setError('');
      onSuccess();
    } else {
      setError('密碼不正確,請再試一次');
    }
  };

  return (
    <div className="max-w-xs mx-auto px-5 py-24 text-center">
      <div className="w-14 h-14 rounded-full mx-auto flex items-center justify-center mb-5" style={{ background: 'var(--limewash)' }}>

      <p style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: '#8a7e6f' }} className="mb-5">請輸入密碼以進入訂單管理後台</p>
      <input
        type="password"
        inputMode="numeric"
        value={value}

      {error && <div className="mb-3 text-xs" style={{ color: 'var(--ember)' }}>{error}</div>}
      <button

        onClick={onBack}
        className="flex items-center justify-center gap-1.5 mx-auto"
        style={{ color: 'var(--olive)', fontFamily: 'var(--font-utility)', fontSize: 12 }}
      >
        <ArrowLeft size={13} /> 回到點餐畫面
      </button>
    </div>
  );
}

function AdminScreen({ onBack, onSettle, onAllCleared }) {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [filter, setFilter] = useState('all');
  const [view, setView] = useState('orders'); // orders | checkout | history
  const [clearing, setClearing] = useState(false);
  const [editingOrderId, setEditingOrderId] = useState(null);
  const [noteDraft, setNoteDraft] = useState('');
  const [addItemId, setAddItemId] = useState('');
  const editMenuById = buildMenuById();
  const menuOptions = [];
  CATS.forEach((cat) => {
    MENU.filter((m) => m.cat === cat.id).forEach((m) => {
      if (m.variants) {
        m.variants.forEach((v) => {
          menuOptions.push({ id: `${m.id}__${v.key}`, label: `${cat.label} - ${m.name} · ${v.label}` });
        });
      } else {
        menuOptions.push({ id: m.id, label: `${cat.label} - ${m.name}` });
      }
    });
  });

  // 即時訂閱:任何裝置(客人手機、其他店員後台)一有異動,這裡會自動收到最新資料
  useEffect(() => {
    setLoading(true);
    const unsubscribe = subscribeOrders(
      (list) => { setOrders(list); setLoading(false); setError(''); },
      (err) => { setError('讀取訂單失敗,請檢查網路連線'); setLoading(false); console.error(err); }
    );
    return () => unsubscribe && unsubscribe();
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    setError('');
    try {
      const list = await loadOrders();
      setOrders(list);
    } catch (e) {
      setError('讀取訂單失敗,請檢查網路連線');
    } finally {
      setLoading(false);
    }
  }, []);

  const clearAllOrders = async () => {
    setClearing(true);
    setError('');
    try {
      const archived = await archiveDay(orders);
      if (!archived) throw new Error('封存歷史紀錄失敗');
      const ok = await saveOrders([]);
      if (!ok) throw new Error('清空失敗');
      setOrders([]);
      if (onAllCleared) onAllCleared();
    } catch (e) {
      setError('結束營業失敗,請重新整理再試(訂單資料仍保留,尚未清空)');
    } finally {
      setClearing(false);
    }
  };

  const settleOrder = async (order) => {
    const updated = orders.map((o) => (o.id === order.id ? { ...o, closed: true, closedAt: new Date().toISOString() } : o));
    setOrders(updated);
    if (editingOrderId === order.id) stopEdit();
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
      // 客人離場、桌位空出後,這一桌下次點餐要視為全新訂單,不再併入這張已結束的訂單
      if (onSettle) onSettle(order.roomId, order.tableIds && order.tableIds.length ? order.tableIds : (order.tableId ? [order.tableId] : []));
    } catch (e) {
      setError('結帳失敗,請重新整理再試');
    }
  };

  const markPaid = async (order) => {
    const updated = orders.map((o) => (o.id === order.id ? { ...o, paid: !o.paid } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('更新付款狀態失敗,請重新整理再試');
    }
  };

  const cycleItemStatus = async (orderId, itemIndex) => {
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const target = orders[oIdx];
    const items = target.items.map((it, i) => {
      if (i !== itemIndex) return it;
      const current = it.status || 'pending';
      const next = STATUS_FLOW[(STATUS_FLOW.indexOf(current) + 1) % STATUS_FLOW.length];
      return { ...it, status: next };
    });
    const updated = orders.map((o, i) => (i === oIdx ? { ...o, items } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('更新狀態失敗,請重新整理再試');
    }
  };

  const removeItem = async (orderId, itemIndex) => {
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const target = orders[oIdx];
    const items = target.items.filter((_, i) => i !== itemIndex);
    // 如果整張訂單的品項都被移除了,乾脆把這張訂單一起刪掉
    const updated = items.length === 0
      ? orders.filter((o) => o.id !== orderId)
      : orders.map((o, i) => (i === oIdx ? { ...o, items, total: items.reduce((s, it) => s + it.price * it.qty, 0) } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('移除品項失敗,請重新整理再試');
    }
  };

  const startEdit = (order) => {
    setEditingOrderId(order.id);
    setNoteDraft(order.note || '');
    setAddItemId('');
  };

  const stopEdit = () => {
    setEditingOrderId(null);
    setNoteDraft('');
    setAddItemId('');
  };

  const updateItemQty = async (orderId, itemIndex, delta) => {
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const target = orders[oIdx];
    const items = target.items.map((it, i) => (i === itemIndex ? { ...it, qty: Math.max(1, it.qty + delta) } : it));
    const updated = orders.map((o, i) => (i === oIdx ? { ...o, items, total: items.reduce((s, it) => s + it.price * it.qty, 0) } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('修改數量失敗,請重新整理再試');
    }
  };

  const addItemToOrder = async (orderId) => {
    const menuItem = editMenuById[addItemId];
    if (!menuItem) return;
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const target = orders[oIdx];
    const items = [...target.items, { id: menuItem.id, name: menuItem.name, price: menuItem.price, qty: 1, status: 'pending' }];
    const updated = orders.map((o, i) => (i === oIdx ? { ...o, items, total: items.reduce((s, it) => s + it.price * it.qty, 0) } : o));
    setOrders(updated);
    setAddItemId('');
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('新增品項失敗,請重新整理再試');
    }
  };

  const saveNote = async (orderId) => {
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const updated = orders.map((o, i) => (i === oIdx ? { ...o, note: noteDraft } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
      stopEdit();
    } catch (e) {
      setError('儲存備註失敗,請重新整理再試');
    }
  };

  const adjustAmountReceived = async (orderId, delta) => {
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const target = orders[oIdx];
    const base = target.amountReceived != null ? target.amountReceived : target.total;
    const next = Math.max(0, base + delta);
    const updated = orders.map((o, i) => (i === oIdx ? { ...o, amountReceived: next } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('更新實收金額失敗,請重新整理再試');
    }
  };

  const resetAmountReceived = async (orderId) => {
    const oIdx = orders.findIndex((o) => o.id === orderId);
    if (oIdx === -1) return;
    const updated = orders.map((o, i) => (i === oIdx ? { ...o, amountReceived: null } : o));
    setOrders(updated);
    try {
      const ok = await saveOrders(updated);
      if (!ok) throw new Error('儲存失敗');
    } catch (e) {
      setError('更新實收金額失敗,請重新整理再試');
    }
  };

  const visible =
    filter === 'all' ? orders :
    filter === 'closed' ? orders.filter((o) => o.closed) :
    orders.filter((o) => !o.closed && orderStatus(o) === filter);

  return (
    <div className="max-w-4xl mx-auto px-5 py-6 pb-16">
      <div className="flex items-center justify-between mb-1">
        <button onClick={onBack} className="flex items-center gap-1.5" style={{ color: 'var(--olive)', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}>
          <ArrowLeft size={14} /> 回到點餐畫面
        </button>
        <button onClick={load} className="flex items-center gap-1.5" style={{ color: 'var(--ash)', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}>
          <RefreshCw size={14} className={loading ? 'animate-spin' : ''} /> 重新整理
        </button>
      </div>
      <div className="flex items-center gap-2 mt-4 mb-2">
        <ChefHat size={20} color="var(--ember)" />
        <span style={{ fontFamily: 'var(--font-display)', fontSize: 22, color: 'var(--ash)' }}>後台訂單管理</span>
      </div>

      <div className="flex gap-2 mb-6">
        <button
          onClick={() => setView('orders')}
          className="flex-1 py-2 rounded-full flex items-center justify-center gap-1.5"
          style={{
            fontFamily: 'var(--font-utility)', fontSize: 12.5,
            background: view === 'orders' ? 'var(--ash)' : 'var(--card)',
            color: view === 'orders' ? '#fff' : 'var(--ash)',
            border: '1px solid var(--line)',
          }}
        >
          <ChefHat size={13} /> 訂單管理
        </button>
        <button
          onClick={() => setView('checkout')}
          className="flex-1 py-2 rounded-full flex items-center justify-center gap-1.5"
          style={{
            fontFamily: 'var(--font-utility)', fontSize: 12.5,
            background: view === 'checkout' ? 'var(--ash)' : 'var(--card)',
            color: view === 'checkout' ? '#fff' : 'var(--ash)',
            border: '1px solid var(--line)',
          }}
        >
          <Receipt size={13} /> 結帳
        </button>
        <button
          onClick={() => setView('history')}
          className="flex-1 py-2 rounded-full flex items-center justify-center gap-1.5"
          style={{
            fontFamily: 'var(--font-utility)', fontSize: 12.5,
            background: view === 'history' ? 'var(--ash)' : 'var(--card)',
            color: view === 'history' ? '#fff' : 'var(--ash)',
            border: '1px solid var(--line)',
          }}
        >
          <Archive size={13} /> 歷史紀錄
        </button>
      </div>

      {error && <div className="mb-4 text-sm" style={{ color: 'var(--ember)' }}>{error}</div>}

      {view === 'checkout' ? (
        <CheckoutView orders={orders} onClearAll={clearAllOrders} clearing={clearing} />
      ) : view === 'history' ? (
        <HistoryView />
      ) : (
        <>
      <div className="flex gap-2 mb-6 flex-wrap">
        {[{ id: 'all', label: '全部' }, { id: 'pending', label: '新訂單' }, { id: 'preparing', label: '製作中' }, { id: 'done', label: '已完成' }, { id: 'closed', label: '已離場' }].map((f) => (
          <button
            key={f.id}
            onClick={() => setFilter(f.id)}
            className="px-3.5 py-1.5 rounded-full"
            style={{
              fontFamily: 'var(--font-utility)', fontSize: 12.5,
              background: filter === f.id ? 'var(--ash)' : 'var(--card)',
              color: filter === f.id ? '#fff' : 'var(--ash)',
              border: '1px solid var(--line)',
            }}
          >
            {f.label}
          </button>
        ))}
      </div>


      {loading ? (
        <div style={{ color: '#a89b8a', fontFamily: 'var(--font-body)' }}>載入中…</div>
      ) : visible.length === 0 ? (
        <div style={{ color: '#a89b8a', fontFamily: 'var(--font-body)' }} className="text-center py-20">目前沒有訂單</div>
      ) : (
        <div className="grid sm:grid-cols-2 gap-4">
          {visible.map((o) => {
            const agg = orderStatus(o);
            const aggSt = STATUS_STYLE[agg];
            const room = roomById[o.roomId];
            const isEditing = editingOrderId === o.id;
            return (
              <div key={o.id} className="rounded-xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)', opacity: o.closed ? 0.55 : 1 }}>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-1.5">
                    {room && <room.icon size={14} color={room.tint} />}
                    <span style={{ fontFamily: 'var(--font-utility)', fontSize: 12.5, color: 'var(--ash)' }}>{o.seatLabel || o.roomName}</span>
                    {isPaid(o) && (
                      <span className="px-2 py-0.5 rounded-full flex items-center gap-1" style={{ background: '#EAEFE2', color: '#5B6B41', fontFamily: 'var(--font-utility)', fontSize: 10 }}>
                        <CheckCircle2 size={9} /> 已付款
                      </span>
                    )}
                    {o.closed && (
                      <span className="px-2 py-0.5 rounded-full" style={{ background: 'var(--limewash)', color: '#8a7e6f', fontFamily: 'var(--font-utility)', fontSize: 10 }}>
                        {o.isTakeout ? '已取貨' : '已離場'}
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2">
                    <span style={{ fontFamily: 'var(--font-utility)', fontSize: 11, color: '#a89b8a' }}>
                      {new Date(o.createdAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                    </span>
                    <button
                      onClick={() => (isEditing ? stopEdit() : startEdit(o))}
                      className="px-2 py-0.5 rounded-full"
                      style={{
                        fontFamily: 'var(--font-utility)', fontSize: 10.5,
                        background: isEditing ? 'var(--ash)' : 'var(--limewash)',
                        color: isEditing ? '#fff' : 'var(--ash)',
                      }}
                    >
                      {isEditing ? '完成編輯' : '編輯'}
                    </button>
                  </div>
                </div>
                <div className="space-y-1.5 mb-3">
                  {o.items.map((it, i) => {
                    const itSt = STATUS_STYLE[it.status || 'pending'];
                    return (
                      <div key={i} className="flex items-center justify-between gap-2">
                        <div className="min-w-0">
                          <div className="truncate" style={{ fontFamily: 'var(--font-body)', fontSize: 13.5, color: 'var(--ash)' }}>{it.name} × {it.qty}</div>
                          <div style={{ fontFamily: 'var(--font-utility)', fontSize: 11, color: '#8a7e6f' }}>{money(it.price * it.qty)}</div>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                          {isEditing && (
                            <div className="flex items-center gap-1" style={{ background: 'var(--limewash)', borderRadius: 999, padding: '2px 4px' }}>
                              <button onClick={() => updateItemQty(o.id, i, -1)} className="w-5 h-5 rounded-full flex items-center justify-center" style={{ background: '#fff', color: 'var(--ash)' }} aria-label={`減少 ${it.name} 數量`}>
                                <Minus size={10} />
                              </button>
                              <span style={{ fontFamily: 'var(--font-utility)', fontSize: 11, minWidth: 12, textAlign: 'center' }}>{it.qty}</span>
                              <button onClick={() => updateItemQty(o.id, i, 1)} className="w-5 h-5 rounded-full flex items-center justify-center" style={{ background: 'var(--ember)', color: '#fff' }} aria-label={`增加 ${it.name} 數量`}>
                                <Plus size={10} />
                              </button>
                            </div>
                          )}
                          <button
                            onClick={() => cycleItemStatus(o.id, i)}
                            className="px-2.5 py-1 rounded-full flex items-center gap-1"
                            style={{ background: itSt.bg, color: itSt.fg, border: `1px solid ${itSt.border}`, fontFamily: 'var(--font-utility)', fontSize: 10.5 }}
                          >
                            {(it.status || 'pending') === 'done' ? <CheckCircle2 size={11} /> : <Clock size={11} />}
                            {ITEM_STATUS_LABEL[it.status || 'pending']}
                          </button>
                          <button
                            onClick={() => removeItem(o.id, i)}
                            className="w-6 h-6 rounded-full flex items-center justify-center"
                            style={{ background: 'var(--limewash)', color: '#a4463a' }}
                            aria-label={`移除 ${it.name}`}
                          >
                            <Trash2 size={12} />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {isEditing && (
                  <div className="mb-3 space-y-3">
                    <div className="flex gap-2">
                      <select
                        value={addItemId}
                        onChange={(e) => setAddItemId(e.target.value)}
                        className="flex-1 rounded-lg px-2.5 py-2 text-xs"
                        style={{ background: 'var(--limewash)', border: '1px solid var(--line)', fontFamily: 'var(--font-body)', color: 'var(--ash)' }}
                      >
                        <option value="">+ 選擇要新增的品項…</option>
                        {menuOptions.map((opt) => (
                          <option key={opt.id} value={opt.id}>{opt.label}</option>
                        ))}
                      </select>
                      <button
                        onClick={() => addItemToOrder(o.id)}
                        disabled={!addItemId}
                        className="px-3 rounded-lg disabled:opacity-40"
                        style={{ background: 'var(--ember)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 12 }}
                      >
                        新增
                      </button>
                    </div>
                    <div>
                      <label className="flex items-center gap-1.5 mb-1" style={{ fontFamily: 'var(--font-utility)', fontSize: 10.5, color: 'var(--olive)' }}>
                        <StickyNote size={11} /> 餐點備註
                      </label>
                      <div className="flex gap-2">
                        <textarea
                          value={noteDraft}
                          onChange={(e) => setNoteDraft(e.target.value)}
                          rows={2}
                          className="flex-1 rounded-lg px-2.5 py-2 text-xs resize-none"
                          style={{ background: '#fff', border: '1px solid var(--line)', fontFamily: 'var(--font-body)', color: 'var(--ash)' }}
                        />
                        <button
                          onClick={() => saveNote(o.id)}
                          className="px-3 rounded-lg"
                          style={{ background: 'var(--ash)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 12 }}
                        >
                          儲存
                        </button>
                      </div>
                    </div>
                    <div>
                      <label className="flex items-center gap-1.5 mb-1.5" style={{ fontFamily: 'var(--font-utility)', fontSize: 10.5, color: 'var(--olive)' }}>
                        <Receipt size={11} /> 實收金額(收錯錢時點選調整,應收 {money(o.total)})
                      </label>
                      <div className="flex items-center gap-3">
                        <button
                          onClick={() => adjustAmountReceived(o.id, -10)}
                          className="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
                          style={{ background: 'var(--limewash)', color: 'var(--ash)' }}
                          aria-label="實收金額減 10"
                        >
                          <Minus size={14} />
                        </button>
                        <span style={{ fontFamily: 'var(--font-display)', fontSize: 18, color: 'var(--ash)', minWidth: 70, textAlign: 'center' }}>
                          {money(o.amountReceived != null ? o.amountReceived : o.total)}
                        </span>
                        <button
                          onClick={() => adjustAmountReceived(o.id, 10)}
                          className="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
                          style={{ background: 'var(--ember)', color: '#fff' }}
                          aria-label="實收金額加 10"
                        >
                          <Plus size={14} />
                        </button>
                        {o.amountReceived != null && o.amountReceived !== o.total && (
                          <button
                            onClick={() => resetAmountReceived(o.id)}
                            className="px-2.5 py-1 rounded-full"
                            style={{ background: 'var(--card)', border: '1px solid var(--line)', color: '#8a7e6f', fontFamily: 'var(--font-utility)', fontSize: 11 }}
                          >
                            還原
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {o.amountReceived != null && o.amountReceived !== o.total && (
                  <div
                    className="flex items-center justify-between mb-1.5 px-2.5 py-1.5 rounded-lg text-xs"
                    style={{
                      background: o.amountReceived < o.total ? '#FBEFE6' : '#EAEFE2',
                      color: o.amountReceived < o.total ? 'var(--ember)' : '#5B6B41',
                      fontFamily: 'var(--font-body)',
                    }}
                  >
                    <span>實收 {money(o.amountReceived)}</span>
                    <span style={{ fontFamily: 'var(--font-utility)' }}>
                      {o.amountReceived < o.total ? `少收 ${money(o.total - o.amountReceived)}` : `多收 ${money(o.amountReceived - o.total)}`}
                    </span>
                  </div>
                )}

                {!isEditing && o.seatNote && (
                  <div className="flex items-start gap-1.5 mb-1.5 text-xs" style={{ color: 'var(--ember)', fontFamily: 'var(--font-body)' }}>
                    <MapPin size={12} className="mt-0.5 shrink-0" /> {o.seatNote}
                  </div>
                )}
                {!isEditing && o.note && (
                  <div className="flex items-start gap-1.5 mb-3 text-xs" style={{ color: 'var(--olive)', fontFamily: 'var(--font-body)' }}>
                    <StickyNote size={12} className="mt-0.5 shrink-0" /> {o.note}
                  </div>
                )}
                <div className="flex items-center justify-between pt-2" style={{ borderTop: '1px dashed var(--line)' }}>
                  <span style={{ fontFamily: 'var(--font-display)', fontSize: 16, color: 'var(--ash)' }}>{money(o.total)}</span>
                  <span
                    className="px-3 py-1.5 rounded-full flex items-center gap-1.5"
                    style={{ background: aggSt.bg, color: aggSt.fg, border: `1px solid ${aggSt.border}`, fontFamily: 'var(--font-utility)', fontSize: 12 }}
                  >
                    {agg === 'done' ? <CheckCircle2 size={13} /> : <Clock size={13} />}
                    整單:{STATUS_LABEL[agg]}
                  </span>
                </div>
                <div className="flex gap-2 mt-3">
                  <button
                    onClick={() => markPaid(o)}
                    className="flex-1 py-2 rounded-full flex items-center justify-center gap-1.5"
                    style={{
                      fontFamily: 'var(--font-utility)', fontSize: 12.5,
                      background: isPaid(o) ? '#EAEFE2' : 'var(--limewash)',
                      color: isPaid(o) ? '#5B6B41' : 'var(--ash)',
                      border: isPaid(o) ? '1px solid #C8D3B4' : '1px solid transparent',
                    }}
                  >
                    <CheckCircle2 size={13} /> {isPaid(o) ? '已付款' : '標記已付款'}
                  </button>
                  {!o.closed && (
                    <button
                      onClick={() => settleOrder(o)}
                      className="flex-1 py-2 rounded-full flex items-center justify-center gap-1.5"
                      style={{ background: 'var(--ash)', color: '#fff', fontFamily: 'var(--font-utility)', fontSize: 12.5 }}
                    >
                      {o.isTakeout ? <ShoppingBag size={13} /> : <Receipt size={13} />} {o.isTakeout ? '已取貨' : '客人已離場'}
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   App
--------------------------------------------------------------- */

function App() {
  const [page, setPage] = useState('floorplan'); // floorplan | tablepick | seatnote | menu | confirm | adminAuth | admin
  const [roomId, setRoomId] = useState(null);
  const [tableIds, setTableIds] = useState([]);
  const [seatNote, setSeatNote] = useState('');
  const [cart, setCart] = useState({});
  const [lastOrder, setLastOrder] = useState(null);
  const [lastOrderMerged, setLastOrderMerged] = useState(false);
  // 每一組座位各自追蹤「目前還能繼續加點的訂單 id」,key 是 roomId:排序後的桌位清單,這樣店員在不同桌之間切換時不會互相搞混
  const [activeOrderIds, setActiveOrderIds] = useState({});
  const [adminAuthed, setAdminAuthed] = useState(false);
  const tableKey = (r, ids) => `${r}:${(ids || []).slice().sort().join(',')}`;
  const currentActiveOrderId = activeOrderIds[tableKey(roomId, tableIds)] || null;

  const switchTable = (rId, tIds) => {
    setRoomId(rId);
    setTableIds(tIds || []);
    setSeatNote('');
    setCart({});
  };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--paper)' }}>
      <style>{`
        :root {
          --ash: #2B2420;
          --ember: #C1440E;
          --olive: #6B7A4F;
          --limewash: #EDE7D9;
          --gold-dark: #9C6B18;
          --paper: #F6F2E9;
          --card: #FFFFFF;
          --line: #E7DFCF;
          --font-display: 'Fraunces', serif;
          --font-body: 'Work Sans', sans-serif;
          --font-utility: 'Space Mono', monospace;
        }
        * { box-sizing: border-box; }
        button { cursor: pointer; }
        button:focus-visible, textarea:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
      `}</style>

      <header className="sticky top-0 z-30 px-5 py-3.5 flex items-center justify-between" style={{ background: 'rgba(246,242,233,0.9)', backdropFilter: 'blur(6px)', borderBottom: '1px solid var(--line)' }}>
        <Logo />
        {page !== 'admin' && page !== 'adminAuth' && (
          <button
            onClick={() => setPage(adminAuthed ? 'admin' : 'adminAuth')}
            className="text-xs px-3 py-1.5 rounded-full"
            style={{ fontFamily: 'var(--font-utility)', color: 'var(--ash)', border: '1px solid var(--line)' }}
          >
            後台
          </button>
        )}
      </header>

      {page === 'floorplan' && (
        <FloorPlanScreen onPickRoom={(id) => {
          setRoomId(id);
          setSeatNote('');
          const room = roomById[id];
          if (room.noTableSelect) { setTableIds([]); setPage('seatnote'); }
          else { setPage('tablepick'); }
        }} />
      )}

      {page === 'tablepick' && (
        <TablePickScreen
          roomId={roomId}
          onBack={() => setPage('floorplan')}
          onPickTable={(rId, tIds) => { setRoomId(rId); setTableIds(tIds); setPage('seatnote'); }}
        />
      )}

      {page === 'seatnote' && (
        <SeatNoteScreen
          roomId={roomId}
          tableIds={tableIds}
          value={seatNote}
          onChange={setSeatNote}
          onBack={() => {
            const room = roomById[roomId];
            setPage(room && room.noTableSelect ? 'floorplan' : 'tablepick');
          }}
          onContinue={() => setPage('menu')}
        />
      )}

      {page === 'menu' && (
        <OrderScreen
          roomId={roomId}
          tableIds={tableIds}
          seatNote={seatNote}
          cart={cart}
          setCart={setCart}
          activeOrderId={currentActiveOrderId}
          onSwitchTable={switchTable}
          onBack={() => {
            setPage('seatnote');
            setCart({});
          }}
          onOrdered={(order, merged) => {
            setLastOrder(order);
            setLastOrderMerged(merged);
            if (!order.isTakeout) {
              setActiveOrderIds((m) => ({ ...m, [tableKey(order.roomId, order.tableIds)]: order.id }));
            }
            setPage('confirm');
          }}
        />
      )}

      {page === 'confirm' && lastOrder && (
        <Confirmation
          order={lastOrder}
          merged={lastOrderMerged}
          onNewOrder={() => setPage('menu')}
          onBackToFloorplan={() => setPage('floorplan')}
        />
      )}

      {page === 'adminAuth' && (
        <AdminAuthScreen
          onSuccess={() => { setAdminAuthed(true); setPage('admin'); }}
          onBack={() => setPage('floorplan')}
        />
      )}

      {page === 'admin' && adminAuthed && (
        <AdminScreen
          onBack={() => setPage('floorplan')}
          onSettle={(rId, tIds) => {
            setActiveOrderIds((m) => {
              const key = tableKey(rId, tIds);
              if (!(key in m)) return m;
              const next = { ...m };
              delete next[key];
              return next;
            });
          }}
          onAllCleared={() => setActiveOrderIds({})}
        />
      )}
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
